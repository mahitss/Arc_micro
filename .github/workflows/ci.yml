name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web:
    name: Web (Next.js) Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build

  gateway:
    name: Go Gateway Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/gateway/go.sum

      - name: Check Formatting (gofmt)
        run: |
          diffs=$(gofmt -s -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted properly:"
            echo "$diffs"
            exit 1
          fi

      - name: Vet Code
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binary
        run: go build -v -o bin/gateway ./cmd/server

  policy-engine:
    name: Rust Policy Engine Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/policy-engine
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/policy-engine

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release
        run: cargo build --release --verbose

  contracts:
    name: Foundry Contracts Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Foundry Build
        run: forge build --sizes

      - name: Foundry Test
        run: forge test -vvv

  sdk-typescript:
    name: TypeScript SDK Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-typescript
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Typecheck & Build
        run: npm run build

      - name: Run Tests
        run: npm test

  sdk-python:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
          pip install -e .

      - name: Run Tests
        run: pytest

  cli:
    name: Developer CLI Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build TypeScript SDK Dependency
        run: |
          cd packages/sdk-typescript
          npm install
          npm run build

      - name: Install CLI Dependencies
        run: |
          cd packages/cli
          npm install

      - name: Build CLI
        run: |
          cd packages/cli
          npm run build

      - name: Run CLI Tests
        run: |
          cd packages/cli
          npm test
