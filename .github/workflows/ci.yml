name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web:
    name: Web (Next.js) Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  gateway:
    name: Go Gateway Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/gateway/go.sum

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binary
        run: go build -v -o bin/gateway ./cmd/server

  policy-engine:
    name: Rust Policy Engine Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/policy-engine
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/policy-engine

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release
        run: cargo build --release --verbose

  contracts:
    name: Foundry Contracts Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Foundry Build
        run: forge build --sizes

      - name: Foundry Test
        run: forge test -vvv
