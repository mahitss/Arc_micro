[project]
name = "agentpay-agent"
version = "0.1.0"
description = "AgentPay Autonomous AI Agent Service powered by Google ADK"
requires-python = ">=3.11,<3.14"

dependencies = [
    "google-adk>=2.8.0,<2.9.0",
    "google-genai>=1.0.0",
    "agentpay",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "openai>=2.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.8.0,<2.9.0",
]
lint = [
    "ruff>=0.4.6",
    "ty>=0.0.1a0",
    "codespell>=2.2.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "C",
    "B",
    "UP",
    "RUF",
]
ignore = ["E501", "C901", "B006", "BLE001"]

[tool.ty.environment]
extra-paths = ["../../packages/sdk-python"]

[tool.uv.sources]
agentpay = { path = "../../packages/sdk-python", editable = true }

